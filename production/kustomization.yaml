apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: governify-production
resources:
  # Reviewed public base; updates are deliberate.
  - https://github.com/governify-next/k8s-infrastructure//base?ref=44d9965af367e01e5008183c72e649a19bd05427
  - strimzi-cluster-role-bindings.yaml
patches:
  - path: remove-headlamp.yaml
  - path: public-urls.yaml
  # CRDs and ClusterRoles are shared with the existing Strimzi 1.3.0 installation.
  # Keep a single Argo owner; production owns its operator and bindings only.
  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '.*\.strimzi\.io'
    patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: shared-strimzi-crds
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: strimzi-.*
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: shared-strimzi-roles
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: strimzi-.*
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: shared-strimzi-bindings
  - target:
      group: rbac.authorization.k8s.io
      kind: RoleBinding
      name: strimzi-.*
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: governify-production
  - target:
      kind: Ingress
      name: governify-next
    path: ingress.yaml
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/os: linux
          kubernetes.io/arch: amd64
